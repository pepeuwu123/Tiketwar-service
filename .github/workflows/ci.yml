name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

env:
  # Docker requires lowercase repository names, and the GitHub repos are
  # named Tiketwar-* with a capital T, so github.repository cannot be used.
  IMAGE: ghcr.io/pepeuwu123/tiketwar-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Opt-in: needs a self-hosted runner labelled `tiketwar` on the VM.
    # Without the variable the job is skipped instead of queuing forever.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, tiketwar]
    steps:
      - name: update the compose checkout
        # Previously this pulled images but never updated the compose file, so the VM
        # would run NEW images against a STALE config. /opt/tiketwar is a git checkout
        # for exactly this reason. Untracked files (.env) are preserved.
        working-directory: /opt/tiketwar
        run: |
          set -eu
          git fetch --depth=1 origin main
          git reset --hard origin/main
          git log --oneline -1

      - name: registry login
        working-directory: /opt/tiketwar
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          if [ -n "${GHCR_TOKEN}" ]; then
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "::warning::GHCR_TOKEN is not set; pulling private images will fail"
          fi

      - name: deploy Tiketwar-service and verify it
        working-directory: /opt/tiketwar
        env:
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -eu
          # Debian ships compose two ways. 'docker compose' is the v2 plugin
          # (docker-compose-v2); 'docker-compose' is the standalone binary. Using the
          # wrong one fails with "docker: unknown command", so detect instead of assume.
          if docker compose version >/dev/null 2>&1; then DC="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then DC="docker-compose"
          else
            echo "::error::no compose found - apt install docker-compose-v2"
            exit 1
          fi
          echo "using: $DC"

          echo "$IMAGE:$TAG" > .deployed-tag
          # No '|| true': a failed pull must fail the deploy. Swallowing it would
          # leave the OLD image running and call it a success.
          $DC pull
          # --wait blocks until every healthcheck passes rather than returning as
          # soon as containers are created.
          $DC up -d --remove-orphans --wait --wait-timeout 180
          $DC ps

          curl -fsS --retry 10 --retry-delay 3 http://localhost:8080/healthz

          # Prove the container is running the image we just built, not a leftover.
          got=$(docker inspect --format '{{.Config.Image}}' "$($DC ps -q service)")
          echo "want: $IMAGE:$TAG"
          echo "got:  $got"
          [ "$got" = "$IMAGE:$TAG" ] || { echo "::error::running image does not match the pushed tag"; exit 1; }
