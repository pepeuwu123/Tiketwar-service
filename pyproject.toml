[project]
name = "tiketwar-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# httpx2: starlette's TestClient warns (StarletteDeprecationWarning) when it has to fall back to httpx
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.16", "fakeredis>=2.24"]
